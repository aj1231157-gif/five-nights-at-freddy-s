<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FREDDY'S NIGHTSHIFT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cutive+Mono&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; font-family:'Courier New',monospace; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; overscroll-behavior:none; -webkit-touch-callout:none; }
  #game { position:fixed; inset:0; width:100%; height:100%; -webkit-tap-highlight-color:transparent; touch-action:none; }
  canvas { display:block; }
  #vignette {
    position:absolute; inset:0; pointer-events:none; z-index:5;
    background:radial-gradient(ellipse at 50% 50%, transparent 22%, rgba(0,0,0,0.72) 76%, rgba(0,0,0,0.98) 100%);
  }

  /* ============ HUD (identidade FNAF clássico: texto livre, linhas finas, vinho só em detalhes) ============ */
  #hud, #controls {
    --hud-mono:'Cutive Mono','Courier New',monospace;
    --hud-type:'Special Elite','American Typewriter','Courier New',serif;
    --bone:#d3c6b6; --bone-dim:#9a8c7d; --bone-low:#7f7265; --bone-faint:rgba(211,198,182,.16);
    --wine:#590503; --wine-hi:#a32a24; --shade:0 0 3px #000, 0 1px 7px #000;
  }
  #hud *, #controls * { font-family:var(--hud-mono); }
  #hud { position:absolute; inset:0; pointer-events:none; z-index:10; }
  .hud-corner { position:absolute; letter-spacing:.14em; color:var(--bone-dim); text-shadow:var(--shade); }
  #hud-left {
    top:22px; left:24px; min-width:196px; padding:2px 40px 5px 14px;
    border-left:1px solid rgba(89,5,3,.9);
    background:linear-gradient(90deg, rgba(0,0,0,.5), rgba(0,0,0,0));
  }
  #hud-right {
    top:22px; right:24px; text-align:right; min-width:150px; padding:2px 14px 5px 40px;
    border-right:1px solid rgba(89,5,3,.9);
    background:linear-gradient(270deg, rgba(0,0,0,.5), rgba(0,0,0,0));
  }
  .hud-label { font-size:.66rem; color:#8a7c6e; letter-spacing:.28em; margin-bottom:1px; transition:color .5s; }
  #hud .power-value { font-family:var(--hud-type); font-size:1.9rem; line-height:1.12; color:var(--bone); letter-spacing:.06em; transition:color .5s; }
  .power-bar-bg { margin-top:7px; width:100%; height:3px; background:var(--bone-faint); overflow:hidden; }
  .power-bar-fill { height:100%; width:100%; background:#b3a493; opacity:.78; transition:width .3s, background-color .6s; }
  .sys-row { font-size:.7rem; color:#8a7c6e; letter-spacing:.16em; margin-top:5px; display:flex; justify-content:space-between; gap:18px; }
  .sys-row span:last-child { color:var(--bone); font-weight:normal; }
  .usage-bar { margin-top:3px; letter-spacing:.35em; font-size:.9rem; color:#b3a493; }
  .usage-bar .on { color:#b3a493; }
  .usage-bar .off { color:rgba(211,198,182,.14); }
  #hud .time-value { font-family:var(--hud-type); font-size:1.5rem; line-height:1.15; color:var(--bone); letter-spacing:.1em; }
  .night-value { font-size:.68rem; color:#8a7c6e; letter-spacing:.3em; margin-top:3px; }

  /* energia baixa: o vinho aparece só no número, na barra e no rótulo — o resto do HUD não muda */
  #hud-left.low .power-value, #hud-left.crit .power-value { color:var(--wine-hi); animation:hud-low 2.8s ease-in-out infinite; }
  #hud-left.low .power-bar-fill, #hud-left.crit .power-bar-fill { background:var(--wine-hi); }
  #hud-left.low .hud-label:first-child, #hud-left.crit .hud-label:first-child { color:#a06a62; }
  #hud-left.crit .power-value { animation-duration:1.4s; }
  @keyframes hud-low { 0%,100%{opacity:1} 50%{opacity:.62} }

  #controls { position:absolute; inset:0; z-index:20; pointer-events:none; }
  .ctrl-btn {
    position:absolute; pointer-events:auto;
    background:linear-gradient(90deg, rgba(0,0,0,.55), rgba(0,0,0,0));
    border:0; border-bottom:1px solid rgba(211,198,182,.2); border-radius:0;
    color:var(--bone-dim); font-size:.78rem; letter-spacing:.2em;
    padding:10px 30px 10px 34px; cursor:pointer; text-align:left; min-width:230px;
    text-shadow:var(--shade);
    transition:color .25s, border-color .25s;
    touch-action:manipulation; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
  }
  .ctrl-btn::before {
    content:''; position:absolute; left:12px; top:50%;
    width:7px; height:7px; margin-top:-3.5px; border-radius:50%;
    border:1px solid rgba(211,198,182,.45); background:transparent;
    transition:background-color .25s, border-color .25s, box-shadow .25s, transform .12s;
  }
  @media (hover:hover) {
    .ctrl-btn:hover { color:var(--bone); border-bottom-color:rgba(211,198,182,.42); }
  }
  .ctrl-btn:focus-visible { outline:1px solid rgba(211,198,182,.5); outline-offset:2px; }
  .ctrl-btn.active { color:var(--bone); border-bottom-color:var(--wine-hi); }
  .ctrl-btn.active::before { background:var(--wine-hi); border-color:var(--wine-hi); box-shadow:0 0 6px rgba(163,42,36,.5); }
  .ctrl-btn.light.active { border-bottom-color:#a8946a; }
  .ctrl-btn.light.active::before { background:#d1b878; border-color:#d1b878; box-shadow:0 0 6px rgba(209,184,120,.4); }
  .ctrl-btn small { display:block; font-size:.62rem; color:var(--bone-low); letter-spacing:.24em; margin-top:3px; transition:color .25s; }
  .ctrl-btn small::before { content:'— '; }
  .ctrl-btn.active small { color:#c9a39a; }
  .ctrl-btn.light.active small { color:#cdb98a; }

  #btn-left-door { bottom:120px; left:24px; }
  #btn-left-light { bottom:60px; left:24px; }
  #btn-right-door { bottom:120px; right:24px; }
  #btn-right-light { bottom:60px; right:24px; }
  #btn-right-door, #btn-right-light {
    text-align:right; padding:10px 34px 10px 30px;
    background:linear-gradient(270deg, rgba(0,0,0,.55), rgba(0,0,0,0));
  }
  #btn-right-door::before, #btn-right-light::before { left:auto; right:12px; }

  #btn-monitor {
    bottom:60px; left:50%; transform:translateX(-50%); min-width:250px; text-align:center; padding:10px 34px;
    background:linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,.55) 22%, rgba(0,0,0,.55) 78%, rgba(0,0,0,0));
  }
  #btn-monitor small::before { content:none; }
  #btn-monitor::before {
    left:14px; width:15px; height:11px; margin-top:-5.5px; border:0; border-radius:0; box-shadow:none;
    background:rgba(211,198,182,.55);
    -webkit-mask:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 15 11'%3E%3Cpath d='M0 1h10v9H0zM11 4l4-3v9l-4-3z'/%3E%3C/svg%3E") center / contain no-repeat;
            mask:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 15 11'%3E%3Cpath d='M0 1h10v9H0zM11 4l4-3v9l-4-3z'/%3E%3C/svg%3E") center / contain no-repeat;
  }
  #btn-monitor.active::before { background:var(--wine-hi); box-shadow:none; border:0; }

<script>
/* ================================================================
   GLITCH DO FREDDY (tela inicial) — puramente decorativo.
   Só mexe em camadas com pointer-events:none dentro de .fz-fwrap;
   nenhum botão é tocado. Eventos raros, curtos e em intervalos aleatórios;
   cada evento termina em reset() (volta exatamente ao normal).
   ================================================================ */
(function () {
  var menu = document.getElementById('menu');
  var wrap = menu && menu.querySelector('.fz-fwrap');
  if (!wrap) return;
  var gR = wrap.querySelector('.fz-gr'), gB = wrap.querySelector('.fz-gb');
  var slices = [].slice.call(wrap.querySelectorAll('.fz-sl'));
  var drop = wrap.querySelector('.fz-drop'), line = wrap.querySelector('.fz-line');
  var eyes = { l: wrap.querySelector('.fz-eye.l'), r: wrap.querySelector('.fz-eye.r') };
  var bars = [].slice.call(menu.querySelectorAll('.fz-bar'));
  var reduce = false;
  try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

  var running = false, timer = 0, lite = false, slow = 0, lastStrong = 0, sinceStrong = 99, mon = null;

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function sign() { return Math.random() < 0.5 ? -1 : 1; }
  function show(el, on) { el.style.display = on ? 'block' : 'none'; }

  function slice(i, strong) {
    var el = slices[i]; if (!el) return;
    var h = strong ? rnd(5, 14) : rnd(2.5, 7.5);
    var top = rnd(14, 82 - h);
    var dx = sign() * (strong ? rnd(2.5, 7) : rnd(0.7, 2.4));      // % da largura da imagem
    var cp = 'inset(' + top.toFixed(1) + '% 0 ' + (100 - top - h).toFixed(1) + '% 0)';
    el.style.clipPath = cp; el.style.webkitClipPath = cp;
    el.style.transform = 'translate3d(' + dx.toFixed(2) + '%,0,0)';
    el.style.display = 'block';
  }
  function ghost(strong) {
    if (lite) return;
    var d = strong ? rnd(1.6, 3.2) : rnd(0.7, 1.6);
    gR.style.transform = 'translate3d(' + (-d).toFixed(2) + '%,0,0)'; gR.style.opacity = strong ? 0.42 : 0.3; show(gR, true);
    gB.style.transform = 'translate3d(' + d.toFixed(2) + '%,0,0)';  gB.style.opacity = strong ? 0.3 : 0.2;  show(gB, true);
  }
  var REG = [[66, 12, 20, 15], [69, 30, 15, 15], [68, 44, 19, 19], [70, 66, 24, 13]];   // testa, olhos, focinho, boca
  function dropOn(soft) {
    var r = REG[(Math.random() * REG.length) | 0];
    drop.style.left = r[0] + '%'; drop.style.top = r[1] + '%'; drop.style.width = r[2] + '%'; drop.style.height = r[3] + '%';
    drop.className = 'fz-drop' + (soft ? ' soft' : '');
    show(drop, true);
  }
  function lineOn() {
    line.style.top = rnd(18, 82).toFixed(1) + '%';
    line.className = 'fz-line' + (Math.random() < 0.35 ? ' dark' : '');
    show(line, true);
  }
  function eyeOn(which, red, power) { var el = eyes[which]; el.className = 'fz-eye ' + which + (red ? ' red' : ''); el.style.opacity = power; }
  function barsOn() {
    if (lite) return;
    for (var i = 0; i < bars.length; i++) {
      bars[i].style.top = rnd(6, 94).toFixed(1) + '%';
      bars[i].style.transform = 'translate3d(' + (sign() * rnd(1, 5)).toFixed(1) + 'vh,0,0)';
      bars[i].style.display = 'block';
    }
  }
  function lum(v) { wrap.style.opacity = v; }

  function reset() {
    for (var i = 0; i < slices.length; i++) slices[i].style.display = 'none';
    show(gR, false); show(gB, false); show(drop, false); show(line, false);
    for (var k in eyes) { eyes[k].className = 'fz-eye ' + k; eyes[k].style.opacity = ''; }
    for (var j = 0; j < bars.length; j++) bars[j].style.display = 'none';
    wrap.style.opacity = '';
    menu.classList.remove('fz-hot');
  }

  var EV = {
    slice: function () {
      var n = Math.random() < 0.35 ? 2 : 1;
      function go() { for (var i = 0; i < n; i++) slice(i, false); }
      return { gap: [2400, 6500], steps: [[0, go], [rnd(50, 95), go], [rnd(45, 90), reset]] };
    },
    eye: function () {
      var which = Math.random() < 0.7 ? 'l' : 'r', red = Math.random() < 0.4, p = rnd(0.35, 0.65), withSlice = Math.random() < 0.3;
      return { gap: [3500, 8000], steps: [
        [0, function () { eyeOn(which, red, p); if (withSlice) slice(0, false); }],
        [rnd(120, 260), function () { eyeOn(which, red, p * 0.4); }],
        [rnd(60, 120), reset]] };
    },
    flicker: function () {
      var g = Math.random() < 0.35;
      return { gap: [3500, 8000], steps: [
        [0, function () { lum(0.5); if (g) ghost(false); }],
        [rnd(40, 70), function () { lum(1); slice(0, false); }],
        [rnd(35, 60), function () { lum(0.62); }],
        [rnd(45, 80), reset]] };
    },
    ghost: function () {
      var sl = Math.random() < 0.4;
      return { gap: [3500, 8000], steps: [
        [0, function () { ghost(false); if (sl) slice(0, false); }],
        [rnd(70, 150), reset]] };
    },
    drop: function () {
      var soft = Math.random() < 0.5;
      return { gap: [3500, 8000], steps: [
        [0, function () { dropOn(soft); if (!soft) lineOn(); }],
        [rnd(60, 120), reset]] };
    },
    strong: function () {
      var n = lite ? 2 : 4;
      function burst() { for (var i = 0; i < n; i++) slice(i, true); }
      return { gap: [12000, 20000], steps: [
        [0, function () { menu.classList.add('fz-hot'); burst(); ghost(true); barsOn(); lum(0.6); }],
        [rnd(55, 75), function () { burst(); dropOn(false); }],
        [rnd(60, 80), function () { burst(); lineOn(); eyeOn('l', true, 0.7); lum(1); }],
        [rnd(55, 75), function () { show(drop, false); burst(); ghost(true); }],
        [rnd(60, 80), function () { burst(); eyeOn('r', false, 0.55); lum(0.55); }],
        [rnd(55, 75), function () { show(drop, false); lum(1); }],
        [rnd(70, 90), reset]] };
    }
  };

  function nextEvent() {
    var now = Date.now(), r = Math.random() * 100;
    if (r < 10 && now - lastStrong > 28000 && sinceStrong >= 4) { lastStrong = now; sinceStrong = 0; return EV.strong(); }
    sinceStrong++;
    r = Math.random() * 90;
    if (r < 38) return EV.slice();
    if (r < 58) return EV.eye();
    if (r < 72) return EV.flicker();
    if (r < 82) return EV.ghost();
    return EV.drop();
  }

  // se o aparelho engasgar durante os efeitos, passa para o modo leve (sem filtros, faixas e rajadas pesadas)
  function beginMon() {
    if (lite) return;
    mon = { last: performance.now(), sum: 0, n: 0, raf: 0 };
    (function tick(t) {
      if (!mon) return;
      var d = t - mon.last; mon.last = t;
      if (d < 500) { mon.sum += d; mon.n++; }
      mon.raf = requestAnimationFrame(tick);
    })(mon.last);
  }
  function endMon() {
    if (!mon) return;
    cancelAnimationFrame(mon.raf);
    if (mon.n >= 4 && mon.sum / mon.n > 40) { if (++slow >= 2) lite = true; } else { slow = 0; }
    mon = null;
  }

  function runSteps(steps, i, gap) {
    if (!running) return;
    if (i >= steps.length) { reset(); endMon(); schedule(rnd(gap[0], gap[1])); return; }
    var st = steps[i];
    timer = setTimeout(function () { if (!running) return; st[1](); runSteps(steps, i + 1, gap); }, st[0]);
  }
  function schedule(ms) { clearTimeout(timer); timer = setTimeout(fire, ms); }
  function fire() {
    if (!running) return;
    if (menu.classList.contains('hidden')) { stop(); return; }
    if (document.hidden) return;                       // retoma no visibilitychange
    var ev = nextEvent();
    beginMon();
    runSteps(ev.steps, 0, ev.gap);
  }
  function start() { if (reduce || running) return; running = true; schedule(rnd(2500, 4500)); }
  function stop() { running = false; clearTimeout(timer); reset(); if (mon) { cancelAnimationFrame(mon.raf); mon = null; } }

  document.addEventListener('visibilitychange', function () {
    if (!running) return;
    if (document.hidden) { clearTimeout(timer); reset(); if (mon) { cancelAnimationFrame(mon.raf); mon = null; } }
    else schedule(rnd(1800, 4000));
  });

  window.FzGlitch = {
    start: start, stop: stop,
    trigger: function (name) {            // usado só para teste manual: FzGlitch.trigger('strong')
      if (!EV[name]) return false;
      clearTimeout(timer); reset(); running = true;
      var ev = EV[name](); beginMon(); runSteps(ev.steps, 0, ev.gap); return true;
    },
    isLite: function () { return lite; }
  };
  start();
})();
</script>

<script>

   - Monitor muito próximo da câmera
   - Sala menor e mais claustrofóbica

var S = {
  ROOM_W: 4.5, ROOM_D: 5.0, ROOM_H: 2.7, WALL_T: 0.14,

  EYE_Y: 1.15, EYE_Z: 1.5,

  COR_Z1: 3.0,    // ponta da FRENTE do corredor (passa da sala, atrás do jogador)
  COR_H: 2.7,
  COR_LEN: 6.6,  // vai de z=-3.6 (um pouco atrás do fundo da sala) até a frente
  COR_W: 2.8      // largura (em X) a partir da parede lateral da sala
};

var GEO = {
  backZ: -S.ROOM_D/2,   // -2.5
  frontZ: S.ROOM_D/2,   //  2.5
  leftX: -S.ROOM_W/2,   // -2.25
  rightX: S.ROOM_W/2,   //  2.25
  // Porta (na parede lateral)
  doorZ0: -1.8,
  doorZ1: -0.8,
  // Janela pequena (logo à frente da porta)
  winZ0: -0.3,
  winZ1: 0.1
};

/* ================================================================
   GAME STATE
   ================================================================ */
var Game = {
  running: false,
  hour: 0, hourProgress: 0, HOUR_DURATION: 45,
  power: 100, usage: 1,
  doors: { left: false, right: false },
  lights: { left: false, right: false },
  monitorOpen: false, paused: false,
  ambientTime: 0, lastFrame: 0,
  doorAnim: { left: 0, right: 0 },
  doorTarget: { left: 0, right: 0 },

   ================================================================ */
var renderer, scene, camera, objs = {};

   ================================================================ */
var Perf = {

  CAP_HZ: 60,          // telas de 110Hz+ (120/144Hz) renderizam a 60 quadros/s (metade da carga, mesma fluidez de jogo)
  SHADOW_HZ: 30,       // sombra da lâmpada atualiza 30x/s (a 60x/s só enquanto uma porta se move)

// Objetos que nunca se movem deixam de ter a matriz recalculada todo quadro.
// Só portas e pás do ventilador continuam sendo atualizadas.
function freezeStaticScene() {
  if (Perf.frozen) return;
  scene.updateMatrixWorld(true);
  var dyn = [];
  if (objs.door_left) dyn.push(objs.door_left);
  if (objs.door_right) dyn.push(objs.door_right);
  if (fanBlades) dyn.push(fanBlades);
  dyn.forEach(function(d) { d.traverse(function(o) { o.userData._dyn = true; }); });
  scene.traverse(function(o) { if (o !== scene && !o.userData._dyn) o.matrixAutoUpdate = false; });

function makeTexture(size, drawFn, repX, repY) {

  return t;
}

function addNoise(ctx, w, h, count, maxAlpha, maxR) {
  for (var i = 0; i < count; i++) {
    ctx.fillStyle = 'rgba(0,0,0,' + (Math.random() * maxAlpha) + ')';
    ctx.beginPath();
    ctx.arc(Math.random()*w, Math.random()*h, 1 + Math.random()*maxR, 0, Math.PI*2);
    ctx.fill();
  }
}

function rnd(a, b) { return a + Math.random() * (b - a); }
function blotch(ctx, x, y, r, rgb, a) {
  var g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, 'rgba(' + rgb + ',' + a + ')'); g.addColorStop(1, 'rgba(' + rgb + ',0)');
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r*2, r*2);
}
function scratches(ctx, w, h, n, rgb, maxA, len) {
  ctx.lineWidth = 1;
  for (var i = 0; i < n; i++) {
    var x = rnd(0, w), y = rnd(0, h), a = rnd(0, Math.PI*2), l = rnd(len*0.3, len);
    ctx.strokeStyle = 'rgba(' + rgb + ',' + rnd(0.02, maxA) + ')';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a)*l, y + Math.sin(a)*l); ctx.stroke();
  }
}
// Envelhece pôsteres/fotos: papel amarelado, manchas, dobras, bordas gastas, tinta desbotada
function ageCanvas(ctx, w, h) {
  ctx.fillStyle = 'rgba(150,115,50,0.28)'; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(160,150,125,0.12)'; ctx.fillRect(0, 0, w, h);
  for (var i = 0; i < 12; i++) blotch(ctx, rnd(0, w), rnd(0, h), rnd(15, 60), '55,32,10', rnd(0.1, 0.3));
  ctx.lineWidth = 2;
  [[w*0.5, 0, w*0.5, h], [0, h*0.5, w, h*0.5], [w*0.22, 0, w*0.3, h]].forEach(function(f) {
    ctx.strokeStyle = 'rgba(0,0,0,0.28)'; ctx.beginPath(); ctx.moveTo(f[0], f[1]); ctx.lineTo(f[2], f[3]); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,240,200,0.12)'; ctx.beginPath(); ctx.moveTo(f[0] + 2, f[1]); ctx.lineTo(f[2] + 2, f[3]); ctx.stroke();
  });
  var e = ctx.createLinearGradient(0, 0, 14, 0);
  e.addColorStop(0, 'rgba(20,10,4,0.6)'); e.addColorStop(1, 'rgba(20,10,4,0)');
  ctx.fillStyle = e; ctx.fillRect(0, 0, 14, h);
  e = ctx.createLinearGradient(0, h, 0, h - 14);
  e.addColorStop(0, 'rgba(20,10,4,0.6)'); e.addColorStop(1, 'rgba(20,10,4,0)');
  ctx.fillStyle = e; ctx.fillRect(0, h - 14, w, 14);
  ctx.fillStyle = 'rgba(15,8,4,0.7)';
  ctx.beginPath(); ctx.moveTo(w, 0); ctx.lineTo(w - 26, 0); ctx.lineTo(w, 30); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0, h); ctx.lineTo(30, h); ctx.lineTo(0, h - 22); ctx.fill();
  scratches(ctx, w, h, 25, '0,0,0', 0.2, 40);
  addNoise(ctx, w, h, 80, 0.25, 3);
}

function makeFloorTex(repX, repY) {
  return makeTexture(512, function(ctx, w, h) {
    var ts = 128, r, c, i;
    for (r = 0; r < 4; r++) for (c = 0; c < 4; c++) {          // quadriculado com variação por ladrilho
      var v = (Math.random() * 9) | 0, d = (r + c) % 2 === 0;
      ctx.fillStyle = d ? 'rgb(' + (22+v) + ',' + (18+v) + ',' + (14+v) + ')' : 'rgb(' + (8+v/2|0) + ',' + (7+v/2|0) + ',' + (6+v/2|0) + ')';
      ctx.fillRect(c*ts, r*ts, ts, ts);
      blotch(ctx, c*ts + rnd(10, 118), r*ts + rnd(10, 118), rnd(20, 60), '0,0,0', rnd(0.1, 0.4));
    }
    for (i = 0; i < 6; i++) blotch(ctx, rnd(0, w), rnd(0, h), rnd(30, 80), '40,28,14', 0.18);   // manchas discretas
    scratches(ctx, w, h, 70, '150,140,125', 0.1, 70);                                              // riscos
    for (i = 0; i < 25; i++) { ctx.fillStyle = 'rgba(70,62,52,' + rnd(0.1, 0.3) + ')'; ctx.fillRect(rnd(0, w), rnd(0, h), rnd(2, 6), rnd(1, 4)); } // lascas
    addNoise(ctx, w, h, 350, 0.5, 6);
    ctx.strokeStyle = 'rgba(0,0,0,0.9)'; ctx.lineWidth = 4;
    for (i = 0; i <= 4; i++) {
      ctx.beginPath(); ctx.moveTo(i*ts, 0); ctx.lineTo(i*ts, h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i*ts); ctx.lineTo(w, i*ts); ctx.stroke();
    }
  }, repX, repY);
}

function makeWallTex(repX, repY) {
  return makeTexture(512, function(ctx, w, h) {
    var i;
    ctx.fillStyle = '#4a3a2e'; ctx.fillRect(0, 0, w, h);
    for (i = 0; i < 70; i++) blotch(ctx, rnd(0, w), rnd(0, h), rnd(25, 90), (i % 3 ? '30,20,12' : '90,70,50'), rnd(0.05, 0.2)); // tinta envelhecida
    for (i = 0; i < 18; i++) {                                                   // escorridos de umidade
      var x = rnd(0, w), y = rnd(0, h * 0.6), l = rnd(60, 220), g = ctx.createLinearGradient(0, y, 0, y + l);
      g.addColorStop(0, 'rgba(12,7,3,0.3)'); g.addColorStop(1, 'rgba(12,7,3,0)');
      ctx.fillStyle = g; ctx.fillRect(x, y, rnd(3, 9), l);
    }
    for (i = 0; i < 9; i++) blotch(ctx, rnd(0, w), rnd(0, h), rnd(40, 100), '10,8,4', 0.25);  // regiões gastas
    for (i = 0; i < 10; i++) {                                                   // rachaduras ramificadas
      var cx = rnd(0, w), cy = rnd(0, h);
      ctx.strokeStyle = 'rgba(0,0,0,' + rnd(0.3, 0.55) + ')'; ctx.lineWidth = rnd(0.8, 1.8);
      ctx.beginPath(); ctx.moveTo(cx, cy);
      for (var s = 0; s < 6; s++) { cx += rnd(-25, 25); cy += rnd(5, 40); ctx.lineTo(cx, cy); }
      ctx.stroke();
    }
    for (i = 0; i < 30; i++) { ctx.fillStyle = 'rgba(105,88,66,' + rnd(0.08, 0.2) + ')'; ctx.fillRect(rnd(0, w), rnd(0, h), rnd(3, 12), rnd(2, 7)); } // tinta descascada
    var gt = ctx.createLinearGradient(0, 0, 0, h);                               // sujeira acumulada em cima/embaixo
    gt.addColorStop(0, 'rgba(0,0,0,0.5)'); gt.addColorStop(0.2, 'rgba(0,0,0,0)');
    gt.addColorStop(0.8, 'rgba(0,0,0,0)'); gt.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = gt; ctx.fillRect(0, 0, w, h);
    var gs = ctx.createLinearGradient(0, 0, w, 0);
    gs.addColorStop(0, 'rgba(0,0,0,0.25)'); gs.addColorStop(0.1, 'rgba(0,0,0,0)');
    gs.addColorStop(0.9, 'rgba(0,0,0,0)'); gs.addColorStop(1, 'rgba(0,0,0,0.25)');
    ctx.fillStyle = gs; ctx.fillRect(0, 0, w, h);
    addNoise(ctx, w, h, 300, 0.25, 3);
  }, repX, repY);
}

function makeWainscotTex(repX, repY) {
  return makeTexture(256, function(ctx, w, h) {
    ctx.fillStyle = '#3a1510'; ctx.fillRect(0, 0, w, h);
    for (var i = 0; i < 12; i++) blotch(ctx, rnd(0, w), rnd(0, h), rnd(15, 50), '10,4,2', rnd(0.15, 0.35));
    scratches(ctx, w, h, 30, '150,100,80', 0.1, 40);
    addNoise(ctx, w, h, 120, 0.4, 5);
  }, repX, repY);
}

function makeWoodTex() {
  return makeTexture(512, function(ctx, w, h) {
    var i;
    ctx.fillStyle = '#3a2010'; ctx.fillRect(0, 0, w, h);
    for (i = 0; i < 8; i++) {                                                    // tábuas com tons diferentes
      ctx.fillStyle = 'rgba(' + (i % 2 ? '70,40,18' : '20,10,4') + ',' + rnd(0.1, 0.25) + ')';
      ctx.fillRect(0, i*h/8, w, h/8);
    }
    for (i = 0; i < 140; i++) {                                                  // veios
      var y = rnd(0, h);
      ctx.strokeStyle = (i % 3 ? 'rgba(15,7,3,' : 'rgba(110,70,35,') + rnd(0.05, 0.3) + ')'; ctx.lineWidth = rnd(0.5, 1.6);
      ctx.beginPath(); ctx.moveTo(0, y);
      ctx.bezierCurveTo(w*0.3, y + rnd(-9, 9), w*0.6, y + rnd(-9, 9), w, y + rnd(-6, 6)); ctx.stroke();
    }
    for (i = 0; i < 4; i++) {                                                    // nós
      var kx = rnd(40, w - 40), ky = rnd(20, h - 20);
      blotch(ctx, kx, ky, rnd(10, 20), '12,5,2', 0.7);
      ctx.strokeStyle = 'rgba(10,4,2,0.4)'; ctx.beginPath(); ctx.ellipse(kx, ky, 26, 9, 0, 0, Math.PI*2); ctx.stroke();
    }
    for (i = 0; i < 7; i++) blotch(ctx, rnd(0, w), rnd(0, h), rnd(20, 60), '8,4,2', rnd(0.15, 0.4)); // manchas
    scratches(ctx, w, h, 90, '170,130,90', 0.14, 80);                            // riscos
    addNoise(ctx, w, h, 250, 0.3, 4);
  }, 1, 1);
}

function makeMetalTex() {
  return makeTexture(256, function(ctx, w, h) {
    var i;
    ctx.fillStyle = '#2a2c2f'; ctx.fillRect(0, 0, w, h);
    for (i = 0; i < 90; i++) {                                                   // escovado
      var x = rnd(0, w);
      ctx.strokeStyle = 'rgba(190,190,200,' + rnd(0.02, 0.1) + ')'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + rnd(-2, 2), h); ctx.stroke();
    }
    scratches(ctx, w, h, 45, '210,210,215', 0.22, 60);                           // riscos
    for (i = 0; i < 9; i++) blotch(ctx, rnd(0, w), rnd(0, h), rnd(8, 30), '120,56,22', rnd(0.15, 0.45)); // oxidação
    for (i = 0; i < 6; i++) blotch(ctx, rnd(0, w), rnd(0, h), rnd(15, 40), '6,6,6', 0.35);
    var ed = ctx.createLinearGradient(0, 0, 0, h);
    ed.addColorStop(0, 'rgba(0,0,0,0.35)'); ed.addColorStop(0.15, 'rgba(0,0,0,0)');
    ed.addColorStop(0.85, 'rgba(0,0,0,0)'); ed.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = ed; ctx.fillRect(0, 0, w, h);
    addNoise(ctx, w, h, 120, 0.3, 3);
  }, 1, 1);
}

/* ================================================================

var MAT = {

MAT.glass = makeMat(0xffffff, 0.12, 0.0, { transparent: true, opacity: 1, side: THREE.DoubleSide,
  map: makeTexture(256, function(ctx, w, h) {

    for (var i = 0; i < 16; i++) blotch(ctx, rnd(0, w), rnd(0, h), rnd(15, 70), '14,12,8', rnd(0.15, 0.4));  // sujeira
    for (i = 0; i < 6; i++) { ctx.fillStyle = 'rgba(14,12,8,0.3)'; ctx.fillRect(rnd(0, w), rnd(0, h * 0.5), rnd(2, 5), rnd(40, 120)); }
    scratches(ctx, w, h, 60, '220,225,230', 0.35, 60);                                                         // micro-riscos

    rg.addColorStop(0.3, 'rgba(180,200,215,0)'); rg.addColorStop(0.45, 'rgba(180,200,215,0.12)'); rg.addColorStop(0.55, 'rgba(180,200,215,0)');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, w, h);

MAT.wall.color.setHex(0x9a928a);

/* ================================================================
   HELPERS
   ================================================================ */
function addMesh(geo, mat, x, y, z, parent) {
  var m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  (parent || scene).add(m);
  return m;
}
function box(w, h, d) { return new THREE.BoxGeometry(w, h, d); }
function cyl(rt, rb, h, s) { return new THREE.CylinderGeometry(rt, rb, h, s || 16); }
function plane(w, h) { return new THREE.PlaneGeometry(w, h); }

/* ================================================================
   SALA
   ================================================================ */
function buildRoom() {
  var W = S.ROOM_W, D = S.ROOM_D, H = S.ROOM_H, T = S.WALL_T;

  addMesh(box(W, 0.12, D), MAT.floor, 0, -0.06, 0);
  addMesh(box(W, 0.14, D), MAT.ceiling, 0, H + 0.07, 0);

  // Parede do fundo
  addMesh(box(W, H, T), MAT.wall, 0, H/2, GEO.backZ - T/2);
  addMesh(box(W - 0.02, 1.05, 0.02), MAT.wainscot, 0, 0.525, GEO.backZ + 0.01);
  addMesh(box(W - 0.02, 0.05, 0.03), MAT.trim, 0, 1.05, GEO.backZ + 0.018);

  // Parede frontal
  addMesh(box(W, H, T), MAT.wall, 0, H/2, GEO.frontZ + T/2);
  addMesh(box(W - 0.02, 1.05, 0.02), MAT.wainscot, 0, 0.525, GEO.frontZ - 0.01);

  buildSideWall('left');
  buildSideWall('right');
}

function buildSideWall(side) {
  var isLeft = (side === 'left');
  var W = S.ROOM_W, H = S.ROOM_H, T = S.WALL_T;
  var wallX = isLeft ? GEO.leftX : GEO.rightX;
  var sign = isLeft ? -1 : 1;
  var xPos = wallX + sign * T/2;

  var doorZ0 = GEO.doorZ0, doorZ1 = GEO.doorZ1;
  var winZ0 = GEO.winZ0, winZ1 = GEO.winZ1;
  var backZ = GEO.backZ, frontZ = GEO.frontZ;

  // Bloco 1: fundo → porta
  var b1 = doorZ0 - backZ;
  if (b1 > 0.01) addMesh(box(T, H, b1), MAT.wall, xPos, H/2, backZ + b1/2);

  // Bloco 2: porta → janela (pilar fino)
  var b2 = winZ0 - doorZ1;
  if (b2 > 0.01) addMesh(box(T, H, b2), MAT.wall, xPos, H/2, doorZ1 + b2/2);

  // Bloco 3: janela → frente
  var b3 = frontZ - winZ1;
  if (b3 > 0.01) addMesh(box(T, H, b3), MAT.wall, xPos, H/2, winZ1 + b3/2);

  // Acima da porta
  addMesh(box(T, H - S.DOOR_H, doorZ1 - doorZ0), MAT.wall, xPos, S.DOOR_H + (H - S.DOOR_H)/2, (doorZ0 + doorZ1)/2);

  // Janela — abaixo e acima
  addMesh(box(T, S.WIN_Y, winZ1 - winZ0), MAT.wall, xPos, S.WIN_Y/2, (winZ0 + winZ1)/2);
  addMesh(box(T, H - S.WIN_Y - S.WIN_H, winZ1 - winZ0), MAT.wall, xPos,
    S.WIN_Y + S.WIN_H + (H - S.WIN_Y - S.WIN_H)/2, (winZ0 + winZ1)/2);

  // Wainscot (só nas partes baixas sólidas)
  var wainsX = xPos + sign * (T/2 + 0.003);
  if (b1 > 0.01) addMesh(box(0.02, 1.05, b1), MAT.wainscot, wainsX, 0.525, backZ + b1/2);
  if (b3 > 0.01) addMesh(box(0.02, 1.05, b3), MAT.wainscot, wainsX, 0.525, winZ1 + b3/2);

  // Rodapé
  var trimX = xPos + sign * (T/2 + 0.006);
  if (b1 > 0.01) addMesh(box(0.03, 0.06, b1), MAT.trim, trimX, 1.05, backZ + b1/2);
  if (b3 > 0.01) addMesh(box(0.03, 0.06, b3), MAT.trim, trimX, 1.05, winZ1 + b3/2);
}

/* ================================================================
   CORREDOR — ALINHADO EM Z COM AS PORTAS (correção principal)
   ================================================================ */
function buildCorridor(side) {
  // Corredor paralelo à lateral da sala: começa pouco atrás do fundo da sala e corre
  // PARA A FRENTE (+Z), passando da frente da sala, como no croqui do usuário.
  var s = (side === 'left') ? -1 : 1;
  var T = S.WALL_T, H = S.COR_H, LEN = S.COR_LEN;
  var XI = S.ROOM_W/2 + T;           // face externa da parede da sala
  var XO = XI + S.COR_W;             // parede externa do corredor (face interna)
  var z1 = S.COR_Z1, z0 = z1 - LEN, zc = (z0 + z1) / 2;
  var fw = XO - S.ROOM_W/2;          // largura do piso/teto
  var fcx = s * (S.ROOM_W/2 + XO) / 2;
  var ccx = s * (XI + XO) / 2;       // eixo central do corredor
  var backZ = GEO.backZ, frontZ = GEO.frontZ;
  var ib = backZ - z0, ifr = z1 - frontZ;   // trechos da parede interna fora da sala

  // Materiais com repetição proporcional (sem esticar texturas)
  var wallMat = makeMat(0x8a847e, 0.92, 0.05, { map: makeWallTex(LEN/2.5, 1) });
  var floorMat = makeMat(0xffffff, 0.82, 0.12, { map: makeFloorTex(fw, LEN) });

  // Piso e teto
  addMesh(box(fw, 0.12, LEN), floorMat, fcx, -0.06, zc);
  addMesh(box(fw, 0.12, LEN), MAT.ceiling, fcx, H + 0.06, zc);

  // Paredes: externa (longa), interna (continua a parede da sala após o fundo dela), topo e fundo
  addMesh(box(T, H, LEN), wallMat, s * (XO + T/2), H/2, zc);
  addMesh(box(T, H, ib), wallMat, s * (S.ROOM_W/2 + T/2), H/2, (backZ + z0) / 2);
  addMesh(box(T, H, ifr), wallMat, s * (S.ROOM_W/2 + T/2), H/2, (frontZ + z1) / 2);
  var capW = XO + T - XI, capX = s * (XI + XO + T) / 2;
  addMesh(box(capW, H, T), MAT.metalDark, capX, H/2, z1 + T/2); // ponta da frente (escura)
  addMesh(box(capW, H, T), MAT.wall, capX, H/2, z0 - T/2);      // fundo atrás da porta

  // Rodapé escuro / lambri
  addMesh(box(0.02, 1.05, LEN), MAT.wainscot, s * (XO - 0.01), 0.525, zc);
  addMesh(box(0.02, 1.05, ib), MAT.wainscot, s * (XI + 0.01), 0.525, (backZ + z0) / 2);
  addMesh(box(0.02, 1.05, ifr), MAT.wainscot, s * (XI + 0.01), 0.525, (frontZ + z1) / 2);
  addMesh(box(0.03, 0.1, LEN), MAT.trim, s * (XO - 0.015), 0.05, zc);
  addMesh(box(0.03, 0.1, ib), MAT.trim, s * (XI + 0.015), 0.05, (backZ + z0) / 2);
  addMesh(box(0.03, 0.1, ifr), MAT.trim, s * (XI + 0.015), 0.05, (frontZ + z1) / 2);

  // Vigas metálicas no teto (a cada 2 m)

  ageCanvas(c, 128, 160);
  var posterMat = new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(cv), roughness: 0.92, metalness: 0.02 });
  [[-2.1, 1.5, 0.6, 0.75], [2.7, 1.45, 0.4, 0.55]].forEach(function(p) {
    var m = new THREE.Mesh(plane(p[2], p[3]), posterMat);
    m.position.set(s * (XO - 0.02), p[1], p[0]); m.rotation.y = -s * Math.PI/2; scene.add(m);
  });
  [[-3.0, 1.4, 0.5, 0.65]].forEach(function(p) {

  var cr1 = addMesh(box(0.5, 0.4, 0.4), MAT.woodDark, s * (XO - 0.45), 0.2, -2.2); cr1.rotation.y = 0.3;
  var cr2 = addMesh(box(0.4, 0.35, 0.4), MAT.woodDark, s * (XI + 0.4), 0.175, -3.0); cr2.rotation.y = -0.5;
  addMesh(box(0.35, 0.3, 0.35), MAT.woodDark, s * (XO - 0.5), 0.15, 0.8);

  // Silhueta distante no fundo do corredor esquerdo: quase invisível, deixa a dúvida

    [-0.15, 0.15].forEach(function(lx) { addMesh(box(0.14, 0.7, 0.14), sm, lx, 0.35, 0, sil); });

  // Câmera de segurança (olha para a porta)

/* ================================================================
   PORTA (rolling shutter) — animação vertical
   ================================================================ */
function buildDoor(side) {
  var isLeft = (side === 'left');
  var wallX = isLeft ? GEO.leftX : GEO.rightX;
  var sign = isLeft ? -1 : 1;
  var DW = S.DOOR_W, DH = S.DOOR_H;
  var dz0 = GEO.doorZ0, dz1 = GEO.doorZ1;
  var dzc = (dz0 + dz1) / 2;

  // TRILHOS verticais
  var railX = wallX + sign * 0.06;
  addMesh(box(0.06, DH + 0.35, 0.07), MAT.metalDark, railX, (DH + 0.35)/2, dz0 - 0.04);
  addMesh(box(0.06, DH + 0.35, 0.07), MAT.metalDark, railX, (DH + 0.35)/2, dz1 + 0.04);

  // Batente superior
  addMesh(box(0.15, 0.04, DW + 0.15), MAT.metalOld, wallX + sign * 0.08, DH + 0.02, dzc);

  // Compartimento superior (onde a porta se esconde)
  addMesh(box(0.24, 0.4, DW + 0.2), MAT.metalOld, wallX + sign * 0.12, DH + 0.22, dzc);
  addMesh(box(0.05, 0.1, DW + 0.1), MAT.ledAmber, wallX + sign * 0.08, DH + 0.42, dzc);

  // A PORTA
  var group = new THREE.Group();
  group.position.set(wallX + sign * 0.08, DH, dzc);

  var segCount = 11, segH = DH / segCount, swW = DW - 0.08;

  for (var i = 0; i < segCount; i++) {
    var segY = -segH/2 - i * segH;
    var seg = new THREE.Mesh(box(0.08, segH - 0.008, swW), MAT.metal);
    seg.position.set(0, segY, 0);
    seg.castShadow = true; seg.receiveShadow = true;
    group.add(seg);
    var groove = new THREE.Mesh(box(0.085, 0.007, swW), MAT.metalDark);
    groove.position.set(0, segY - segH/2 + 0.005, 0);
    group.add(groove);
  }

  // Rebites verticais
  for (var zz = -1; zz <= 1; zz += 2) {
    for (var r = 0; r < segCount; r += 2) {
      var riv = new THREE.Mesh(cyl(0.008, 0.008, 0.09, 6), MAT.metalBrass);
      riv.rotation.x = Math.PI/2;
      riv.position.set(0, -segH/2 - r*segH - segH/2, zz * swW * 0.32);
      group.add(riv);
    }
  }

  // Faixa amarela no meio
  for (var s = 0; s < 3; s++) {
    var stripe = new THREE.Mesh(box(0.085, 0.055, swW * 0.7), s % 2 === 0 ? MAT.ledAmber : MAT.metalDark);
    stripe.position.set(0, -DH * 0.38 - s * 0.06, 0);
    group.add(stripe);
  }

  // Alça
  var handleBase = new THREE.Mesh(box(0.04, 0.06, 0.16), MAT.metalBrass);
  handleBase.position.set(sign * 0.06, -DH * 0.32, 0);
  group.add(handleBase);
  var handleBar = new THREE.Mesh(cyl(0.013, 0.013, 0.2, 8), MAT.metalBrass);
  handleBar.rotation.x = Math.PI/2;
  handleBar.position.set(sign * 0.08, -DH * 0.32, 0);
  group.add(handleBar);

  group.traverse(function(o) { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(group);
  objs['door_' + side] = group;
  objs['doorSegH_' + side] = segH;

  // Começa ABERTA
  group.position.y = 2 * DH;

  // LED vermelho acima da porta
  var ledAbove = addMesh(cyl(0.045, 0.045, 0.06, 12), MAT.ledRed,
    wallX + sign * 0.15, DH + 0.55, dzc);
  ledAbove.rotation.z = Math.PI/2;
  objs['door_led_' + side] = ledAbove;

  // Halo físico
  var halo = new THREE.PointLight(0xff2200, 0.5, 2.0, 2);
  halo.position.set(wallX + sign * 0.5, DH + 0.5, dzc);
  scene.add(halo);
  objs['door_halo_' + side] = halo;

  // Painel de emergência lateral
  var panel = new THREE.Group();
  panel.position.set(wallX + sign * 0.1, 1.3, dz1 + 0.35);
  addMesh(box(0.12, 0.4, 0.15), makeMat(0x1a0505, 0.7, 0.1), 0, 0, 0, panel);
  addMesh(box(0.08, 0.12, 0.01), MAT.ledRed, 0, 0.11, 0.08, panel);
  addMesh(box(0.08, 0.12, 0.01), MAT.ledWhite, 0, -0.11, 0.08, panel);
  scene.add(panel);

  // Luz vermelha da porta (fechada)
  var dLight = new THREE.PointLight(0xff1a00, 0, 2.5, 2);
  dLight.position.set(wallX + sign * 0.6, 1.2, dzc);
  scene.add(dLight);
  objs['door_light_' + side] = dLight;
}

function buildWindowSmall(side) {

  addMesh(box(fT, fD, (wz1 - wz0) + 0.11), MAT.metalOld, xPos, winY + winH + 0.028, wzc);

  // Cruzeta central (vertical)
  addMesh(box(0.03, winH, 0.035), MAT.metalDark, xPos, winY + winH/2, wzc);

  // Parafusos nos cantos
  for (var s = -1; s <= 1; s += 2) for (var t = -1; t <= 1; t += 2) {

    scene.add(sc);
  }

  // VIDRO
  var glassMesh = new THREE.Mesh(box(0.045, winH, wz1 - wz0), MAT.glass);
  glassMesh.position.set(xPos, winY + winH/2, wzc);
  scene.add(glassMesh);

  // Peitoril
  addMesh(box(0.1, 0.04, wz1 - wz0 + 0.16), MAT.metalOld, xPos + sign * 0.045, winY - 0.02, wzc);

  // Reflexo sutil

    makeMat(0xffffff, 0.08, 0.0, { transparent: true, opacity: 0.05, side: THREE.DoubleSide }));
  refl.position.set(xPos + sign * 0.011, winY + winH/2, wzc);
  refl.rotation.y = sign > 0 ? -Math.PI/2 : Math.PI/2;
  scene.add(refl);
}

/* ================================================================
   MESA (mais próxima do jogador)
   ================================================================ */
function buildDesk() {
  var DW = S.DESK_W, DD = S.DESK_D, DH = S.DESK_H, DT = S.DESK_T;
  var dZ = -0.35;   // mesa ~0.25 m mais perto do jogador

  addMesh(box(DW, DT, DD), MAT.wood, 0, DH - DT/2, dZ);
  addMesh(box(DW + 0.012, 0.008, DD + 0.012), MAT.woodDark, 0, DH - DT, dZ);
  addMesh(box(DW, DH - DT, 0.03), MAT.woodDark, 0, (DH - DT)/2, dZ + DD/2 - 0.02);
  addMesh(box(DW, DH - DT, 0.03), MAT.woodDark, 0, (DH - DT)/2, dZ - DD/2 + 0.02);
  addMesh(box(0.07, DH - DT, DD - 0.05), MAT.woodDark, -DW/2 + 0.06, (DH - DT)/2, dZ);
  addMesh(box(0.07, DH - DT, DD - 0.05), MAT.woodDark, DW/2 - 0.06, (DH - DT)/2, dZ);

  // 3 gavetas
  for (var i = 0; i < 3; i++) {
    var dx = -DW/2 + DW/6 + i * DW/3;
    var dw = DW/3 - 0.12;
    var dh = 0.19;
    var dy = DH - DT - 0.16;
    addMesh(box(dw, dh, 0.025), MAT.wood, dx, dy, dZ + DD/2 - 0.012);
    addMesh(box(dw - 0.02, 0.005, 0.028), MAT.woodDark, dx, dy + dh/2 - 0.01, dZ + DD/2 - 0.011);
    var hb = addMesh(cyl(0.007, 0.007, 0.14, 8), MAT.metalBrass, dx, dy, dZ + DD/2 + 0.025);
    hb.rotation.x = Math.PI/2;
    addMesh(box(0.016, 0.016, 0.016), MAT.metalBrass, dx - 0.07, dy, dZ + DD/2 + 0.015);
    addMesh(box(0.016, 0.016, 0.016), MAT.metalBrass, dx + 0.07, dy, dZ + DD/2 + 0.015);
  }

  // Cantoneiras
  for (var sx = -1; sx <= 1; sx += 2) for (var sz = -1; sz <= 1; sz += 2) {
    addMesh(box(0.06, 0.06, 0.06), MAT.metalOld,
      sx * (DW/2 - 0.04), DH - DT - 0.04, dZ + sz * (DD/2 - 0.04));
  }

  // Riscos
  for (var k = 0; k < 6; k++) {
    var rx = (Math.random() - 0.5) * DW * 0.85;
    var rz = dZ + (Math.random() - 0.5) * DD * 0.65;
    addMesh(box(0.35, 0.001, 0.006), MAT.woodDark, rx, DH + 0.001, rz);
  }

  // Desgaste nos cantos, poeira e manchas (cada marca é uma textura translúcida sobre o tampo)
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(function(q) {
    addMesh(box(0.05, 0.004, 0.05), MAT.woodDark, q[0] * (DW/2 - 0.02), DH + 0.001, dZ + q[1] * (DD/2 - 0.02)).rotation.y = 0.5;
  });
  var dc = document.createElement('canvas'); dc.width = 1024; dc.height = 256;
  var dx2 = dc.getContext('2d');
  for (var di = 0; di < 22; di++) blotch(dx2, rnd(0, 1024), rnd(0, 256), rnd(20, 90), '150,142,128', rnd(0.04, 0.12));
  for (di = 0; di < 5; di++) blotch(dx2, rnd(0, 1024), rnd(0, 256), rnd(15, 45), '8,4,2', rnd(0.3, 0.5));
  dx2.strokeStyle = 'rgba(12,6,2,0.5)'; dx2.lineWidth = 3;                    // anel de copo
  dx2.beginPath(); dx2.arc(300, 150, 18, 0, Math.PI*2); dx2.stroke();
  dx2.beginPath(); dx2.arc(312, 140, 16, 0.3, 5.4); dx2.stroke();
  addNoise(dx2, 1024, 256, 500, 0.3, 2);
  var dust = new THREE.Mesh(plane(DW - 0.02, DD - 0.02), new THREE.MeshStandardMaterial({
    map: new THREE.CanvasTexture(dc), transparent: true, roughness: 1, metalness: 0, depthWrite: false }));
  dust.rotation.x = -Math.PI/2; dust.position.set(0, DH + 0.0015, dZ);
  scene.add(dust);

  objs.deskZ = dZ;
}

function drawMonitorScreen() {

  var ctx = monitorCtx, w = 512, h = 384;

  ctx.fillStyle = '#040303'; ctx.fillRect(0, 0, w, h);

  ctx.strokeStyle = 'rgba(211, 198, 182, 0.045)';

  }

  ctx.strokeStyle = '#6b2b27'; ctx.lineWidth = 2;
  ctx.strokeRect(14, 14, w - 28, h - 28);

  ctx.fillStyle = '#847566'; ctx.font = 'bold 10px Courier';
  ctx.fillText('ARMAZ.', 40, 122);
  ctx.strokeRect(30, 155, 80, 60);
  ctx.fillText('COZINHA', 38, 187);
  ctx.strokeRect(115, 90, 140, 125);
  ctx.fillText('SALÃO', 165, 155);
  ctx.strokeRect(140, 100, 90, 35);
  ctx.fillStyle = '#d3c6b6'; ctx.fillText('PALCO', 168, 122);
  ctx.strokeStyle = '#8a7c6e'; ctx.fillStyle = '#847566';
  ctx.strokeRect(260, 90, 60, 60); ctx.fillText('BAN. F', 275, 122);
  ctx.strokeRect(325, 90, 60, 60); ctx.fillText('BAN. M', 340, 122);
  ctx.strokeRect(260, 155, 125, 60); ctx.fillText('ESCRITÓRIO', 295, 187);
  ctx.strokeStyle = '#7d7064';
  ctx.strokeRect(30, 220, 355, 30);
  ctx.fillStyle = '#d3c6b6';
  ctx.fillText('CORREDOR PRINCIPAL', 145, 240);

  // Sala de segurança
  ctx.strokeStyle = '#a32a24'; ctx.lineWidth = 2;
  ctx.fillStyle = 'rgba(89, 5, 3, 0.35)';
  ctx.fillRect(155, 260, 110, 90);
  ctx.strokeRect(155, 260, 110, 90);
  ctx.fillStyle = '#d8b8a8'; ctx.font = 'bold 10px Courier';
  ctx.fillText('SALA DE', 195, 293);
  ctx.fillText('SEGURANÇA', 185, 308);

  // Corredores laterais (desenhados como extensões do mapa atual)
  ctx.strokeStyle = '#7d7064'; ctx.lineWidth = 1.5;
  ctx.strokeRect(30, 260, 105, 90);
  ctx.strokeRect(280, 260, 105, 90);

  // Câmeras
  var cams = [

    [65, 305], [335, 305],
    [65, 185], [65, 120],
    [355, 120], [210, 240]
  ];
  for (var i = 0; i < cams.length; i++) {
    ctx.fillStyle = 'rgba(163, 42, 36, 0.3)';
    ctx.beginPath(); ctx.arc(cams[i][0], cams[i][1], 10, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#a32a24';
    ctx.beginPath(); ctx.arc(cams[i][0], cams[i][1], 5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#d8b8a8'; ctx.lineWidth = 1.5; ctx.stroke();
  }

  ctx.fillStyle = '#d3c6b6'; ctx.font = '10px Courier';
  ctx.fillText('● REC', w - 68, 40);

  ctx.fillStyle = '#8a7c6e';
  var h12 = (Game.hour === 0 ? 12 : Game.hour);

  ctx.fillText(h12 + ':' + mm + ' AM', w - 78, 62);

    new THREE.Vector3(0.0, -0.345, -0.5), new THREE.Vector3(-0.1, -0.345, -0.8)]);

    color: 0x8a8478, transparent: true, opacity: 0.05, depthWrite: false }));

  fanGroup.traverse(function(o) { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

/* ================================================================
   MODO DE JOGO (PC / CELULAR) — só muda interface e forma de entrada.
   Toda a lógica continua em toggleDoor / toggleLight / toggleMonitor.
   ================================================================ */
var Mode = { current: 'pc' };

function detectDefaultMode() {
  try {
    var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    var noHover = window.matchMedia && window.matchMedia('(hover: none)').matches;
    if (coarse && noHover) return 'mobile';
  } catch (e) {}
  return 'pc';
}
function loadSavedMode() {
  try { var m = localStorage.getItem('fn_mode'); if (m === 'pc' || m === 'mobile') return m; } catch (e) {}
  return null;
}
// Botões do menu: respondem ao primeiro toque. A seleção acontece ao ENCOSTAR (pointerdown) e o
// início ao SOLTAR dentro do botão (com folga) — não depende de o "click" sobreviver a mudanças de layout.
function releaseLandscape() {
  try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
  try { if (document.fullscreenElement && document.exitFullscreen) { var r = document.exitFullscreen(); if (r && r.catch) r.catch(function() {}); } } catch (e) {}
}
function bindMenuButtons() {
  var coarse = false;
  try { coarse = window.matchMedia('(pointer: coarse)').matches; } catch (e) {}
  function bindMode(id, mode) {
    var el = document.getElementById(id);
    el.addEventListener('pointerdown', function(e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      setMode(mode);
    });
    el.addEventListener('click', function() {          // teclado / leitor de tela / fallback
      setMode(mode);
      if (coarse) { if (mode === 'mobile') tryLockLandscape(); else releaseLandscape(); }
    });
  }
  bindMode('mode-pc', 'pc');
  bindMode('mode-mobile', 'mobile');

  var sb = document.getElementById('btn-start'), pressed = false, suppressUntil = 0;
  sb.addEventListener('pointerdown', function(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    pressed = true;
  });
  sb.addEventListener('pointerup', function(e) {
    if (!pressed) return;
    pressed = false;
    var r = sb.getBoundingClientRect(), pad = 24;
    if (e.clientX >= r.left - pad && e.clientX <= r.right + pad && e.clientY >= r.top - pad && e.clientY <= r.bottom + pad) {
      suppressUntil = performance.now() + 800;
      startNight();
    }
  });
  sb.addEventListener('pointercancel', function() { pressed = false; });
  sb.addEventListener('click', function() {            // teclado / leitor de tela
    if (performance.now() < suppressUntil) return;
    startNight();
  });
}
function setMode(mode) {
  var next = (mode === 'mobile') ? 'mobile' : 'pc';
  if (Mode.ready && next === Mode.current) { refreshOrientation(); return; }
  Mode.ready = true;
  Mode.current = next;
  try { localStorage.setItem('fn_mode', Mode.current); } catch (e) {}
  var g = document.getElementById('game');
  g.classList.toggle('mode-mobile', Mode.current === 'mobile');
  g.classList.toggle('mode-pc', Mode.current === 'pc');
  document.getElementById('mode-pc').classList.toggle('selected', Mode.current === 'pc');
  document.getElementById('mode-mobile').classList.toggle('selected', Mode.current === 'mobile');
  refreshOrientation();
  applyViewport();
}
function isPortrait() { return window.innerHeight > window.innerWidth; }
function refreshOrientation() {
  var needRotate = Mode.current === 'mobile' && isPortrait();
  var ov = document.getElementById('rotate-overlay');
  ov.classList.toggle('hidden', !needRotate);
  ov.classList.toggle('soft', !Game.running);   // no menu: só um aviso, não bloqueia os botões
  Game.paused = needRotate && Game.running;
}
// Tenta tela cheia + travar paisagem (só funciona com gesto do usuário; falhar é normal)
function tryLockLandscape() {
  try {
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    var p = req ? req.call(el) : null;
    var lock = function() {
      try {
        if (screen.orientation && screen.orientation.lock) {
          var r = screen.orientation.lock('landscape');
          if (r && r.catch) r.catch(function() {});
        }
      } catch (e) {}
    };
    if (p && p.then) p.then(lock, lock); else lock();
    if (p && p.catch) p.catch(function() {});
  } catch (e) {}
}
// Câmera: no celular, se a tela for mais "quadrada" que 16:9, aumenta o FOV vertical
// para manter o mesmo enquadramento horizontal de 16:9. No PC nada muda.
function applyViewport() {
  if (!renderer || !camera) return;
  var w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  var baseFov = 78;
  if (Mode.current === 'mobile' && camera.aspect < 16 / 9) {
    var hf = 2 * Math.atan(Math.tan(baseFov * Math.PI / 360) * (16 / 9));
    baseFov = 2 * Math.atan(Math.tan(hf / 2) / camera.aspect) * 180 / Math.PI;
    baseFov = Math.min(baseFov, 100);
  }
  camera.fov = baseFov;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Perf.ratio);
  renderer.setSize(w, h);
}

/* ================================================================
   INIT
   ================================================================ */
function showError(msg) {
  var el = document.getElementById('loading-err');
  if (el) { el.textContent = 'ERRO: ' + msg; el.classList.remove('hidden'); }
  if (window.console) console.error(msg);
}

function init() {
  try {
    var container = document.getElementById('game');
    if (!container) throw new Error('Container não encontrado');

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, stencil: false, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    Perf.ratio = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setPixelRatio(Perf.ratio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    container.insertBefore(renderer.domElement, container.firstChild);

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050403);
    scene.fog = new THREE.FogExp2(0x080605, 0.04);

    // FOV maior para caber os corredores nas laterais
    camera = new THREE.PerspectiveCamera(78, window.innerWidth / window.innerHeight, 0.05, 50);
    camera.position.set(0, S.EYE_Y, S.EYE_Z);
    camera.lookAt(0, 1.05, -0.6);   // câmera inalterada

    // Construção
    buildRoom();
    buildCorridor('left');
    buildCorridor('right');
    buildCorridorFunctionalLights();
    buildDoor('left');
    buildDoor('right');
    buildWindowSmall('left');
    buildWindowSmall('right');
    buildDesk();
    buildMonitor();
    buildFan();
    buildDeskObjects();
    buildCeilingLamp();
    buildWallDecor();
    setupLighting();

    // Eventos
    document.getElementById('btn-left-door').addEventListener('pointerdown', function(e) { if (e.pointerType === 'mouse' && e.button !== 0) return; e.preventDefault(); toggleDoor('left'); });
    document.getElementById('btn-right-door').addEventListener('pointerdown', function(e) { if (e.pointerType === 'mouse' && e.button !== 0) return; e.preventDefault(); toggleDoor('right'); });
    document.getElementById('btn-left-light').addEventListener('pointerdown', function(e) { if (e.pointerType === 'mouse' && e.button !== 0) return; e.preventDefault(); toggleLight('left'); });
    document.getElementById('btn-right-light').addEventListener('pointerdown', function(e) { if (e.pointerType === 'mouse' && e.button !== 0) return; e.preventDefault(); toggleLight('right'); });
    document.getElementById('btn-monitor').addEventListener('pointerdown', function(e) { if (e.pointerType === 'mouse' && e.button !== 0) return; e.preventDefault(); toggleMonitor(); });

    document.addEventListener('keydown', function(e) {
      if (!Game.running) return;
      if (e.code === 'KeyA') toggleDoor('left');
      if (e.code === 'KeyD') toggleDoor('right');
      if (e.code === 'KeyQ') toggleLight('left');
      if (e.code === 'KeyE') toggleLight('right');
      if (e.code === 'Space') { e.preventDefault(); toggleMonitor(); }
    });

    // Seleção de modo (a escolha do jogador tem prioridade sobre a detecção automática)
    bindMenuButtons();
    setMode(loadSavedMode() || detectDefaultMode());

    function onViewportChange() { refreshOrientation(); applyViewport(); }
    window.addEventListener('resize', onViewportChange);
    window.addEventListener('orientationchange', function() { setTimeout(onViewportChange, 150); });

    document.getElementById('loading').classList.add('hidden');
    document.getElementById('vignette').classList.remove('hidden');
  } catch (err) {
    showError(err.message || String(err));
  }
}

function getDoorLedMat(side) {
  var k = 'door_led_closed_' + side;
  if (!objs[k]) objs[k] = makeMat(0x000000, 0.3, 0.2, { emissive: 0xff1a00, emissiveIntensity: 2.5 });
  return objs[k];
}

/* ================================================================
   CONTROLES
   ================================================================ */
function toggleDoor(side) {
  if (!Game.running) return;
  Game.doors[side] = !Game.doors[side];
  Game.doorTarget[side] = Game.doors[side] ? 1 : 0;
  updateHUD();
}
function toggleLight(side) {
  if (!Game.running) return;
  Game.lights[side] = !Game.lights[side];
  updateHUD();
}
function toggleMonitor() {
  if (!Game.running) return;
  Game.monitorOpen = !Game.monitorOpen;
  updateHUD();
}

var _hudEls = {};
function _hudEl(id) { return _hudEls[id] || (_hudEls[id] = { el: document.getElementById(id), t: null, w: null, a: null }); }
function setText(id, v) { var c = _hudEl(id); if (c.t !== v) { c.t = v; c.el.textContent = v; } }
function setWidth(id, v) { var c = _hudEl(id); if (c.w !== v) { c.w = v; c.el.style.width = v; } }
function setActive(id, on) { var c = _hudEl(id); if (c.a !== on) { c.a = on; c.el.classList.toggle('active', on); } }
function updateHUD() {
  setText('power-display', Math.floor(Game.power) + '%');
  setWidth('power-bar', (Math.round(Game.power * 10) / 10) + '%');
  var pLvl = Game.power <= 10 ? 2 : (Game.power <= 25 ? 1 : 0);      // só visual: o HUD reage à energia real
  if (_hudCache.__powerLvl !== pLvl) {
    _hudCache.__powerLvl = pLvl;
    var hl = document.getElementById('hud-left');
    hl.classList.toggle('low', pLvl === 1); hl.classList.toggle('crit', pLvl === 2);
  }

  var h12 = (Game.hour === 0 ? 12 : Game.hour);
  var mm = String(Math.floor(Game.hourProgress * 60));
  if (mm.length < 2) mm = '0' + mm;
  setText('time-display', h12 + ':' + mm + ' AM');

  setText('sys-cam', '0.1');
  setText('sys-doors', ((Game.doors.left ? 1.2 : 0) + (Game.doors.right ? 1.2 : 0)).toFixed(1));
  setText('sys-lights', ((Game.lights.left ? 0.8 : 0) + (Game.lights.right ? 0.8 : 0)).toFixed(1));

  var bars = Math.min(4, Game.usage);
  var html = '';
  for (var i = 0; i < 4; i++) html += '<span class="' + (i < bars ? 'on' : 'off') + '">▮</span>';
  setHTML('usage-display', html);

  setHTML('btn-left-door',
    'PORTA ESQ.<small>' + (Game.doors.left ? 'FECHADA' : 'ABERTA') + '</small>');
  setHTML('btn-right-door',
    'PORTA DIR.<small>' + (Game.doors.right ? 'FECHADA' : 'ABERTA') + '</small>');
  setHTML('btn-left-light',
    'LUZ ESQ.<small>' + (Game.lights.left ? 'LIGADA' : 'DESLIGADA') + '</small>');
  setHTML('btn-right-light',
    'LUZ DIR.<small>' + (Game.lights.right ? 'LIGADA' : 'DESLIGADA') + '</small>');
  setHTML('btn-monitor',
    'MONITOR DE CÂMERAS<small>' + (Game.monitorOpen ? 'ATIVO' : 'ESPAÇO') + '</small>');

  setActive('btn-left-door', Game.doors.left);
  setActive('btn-right-door', Game.doors.right);
  setActive('btn-left-light', Game.lights.left);
  setActive('btn-right-light', Game.lights.right);
  setActive('btn-monitor', Game.monitorOpen);
}

/* ================================================================
   START
   ================================================================ */
var _starting = false;
function startNight() {
  if (Game.running || _starting) return;          // vários toques rápidos iniciam UMA partida só
  _starting = true;
  try { _startNightCore(); }
  catch (err) {                                   // falha recuperável: volta ao menu, botão continua utilizável
    Game.running = false;
    document.getElementById('menu').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('controls').classList.add('hidden');
    if (window.console) console.error(err);
    if (window.FzGlitch) FzGlitch.start();
  } finally { _starting = false; }
}
function _startNightCore() {
  if (Mode.current === 'mobile') tryLockLandscape();
  Game.running = true;
  Game.paused = false;
  Game.lastFrame = performance.now();
  Game.hour = 0; Game.hourProgress = 0;
  Game.power = 100; Game.usage = 1;
  Game.flickerNext = 3;
  perfReset();
  getDoorLedMat('left'); getDoorLedMat('right');
  var mob = Mode.current === 'mobile';
  renderer.shadowMap.autoUpdate = !mob;     // celular: sombra controlada pelo loop
  renderer.shadowMap.needsUpdate = true;
  if (mob) freezeStaticScene();
  document.getElementById('menu').classList.add('hidden');
  if (window.FzGlitch) FzGlitch.stop();
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('controls').classList.remove('hidden');
  updateHUD();
  refreshOrientation();
  applyViewport();
  requestAnimationFrame(loop);
}

/* ================================================================
   UPDATE
   ================================================================ */
function update(dt) {
  Game.ambientTime += dt;

  Game.hourProgress += dt / Game.HOUR_DURATION;
  if (Game.hourProgress >= 1) {
    Game.hourProgress = 0;
    Game.hour++;
    if (Game.hour >= 6) Game.hour = 0;
  }

  var usage = 1;
  if (Game.doors.left) usage += 1.2;
  if (Game.doors.right) usage += 1.2;
  if (Game.lights.left) usage += 0.8;
  if (Game.lights.right) usage += 0.8;
  if (Game.monitorOpen) usage += 0.3;
  Game.usage = Math.min(4, usage);
  var drain = (100 / (Game.HOUR_DURATION * 6)) * usage * 0.5;
  Game.power = Math.max(0, Game.power - drain * dt);

  // Animar portas
  var doorH = S.DOOR_H;
  ['left', 'right'].forEach(function(side) {
    var group = objs['door_' + side];
    if (!group) return;
    var target = Game.doorTarget[side];
    var cur = Game.doorAnim[side];
    var rate = 7;
    if (cur < target) cur = Math.min(target, cur + rate * dt);
    else if (cur > target) cur = Math.max(target, cur - rate * dt);
    Game.doorAnim[side] = cur;
    group.position.y = doorH * (2 - cur);
  });

  // Luzes funcionais dos corredores
  var targetL = Game.lights.left ? 1.4 : 0;
  var targetR = Game.lights.right ? 1.4 : 0;
  if (objs.corrLightLeft) objs.corrLightLeft.intensity += (targetL - objs.corrLightLeft.intensity) * dt * 20;
  if (objs.corrLightRight) objs.corrLightRight.intensity += (targetR - objs.corrLightRight.intensity) * dt * 20;
  if (objs.corrBackLightLeft) objs.corrBackLightLeft.intensity += ((Game.lights.left ? 0.7 : 0) - objs.corrBackLightLeft.intensity) * dt * 20;
  if (objs.corrBackLightRight) objs.corrBackLightRight.intensity += ((Game.lights.right ? 0.7 : 0) - objs.corrBackLightRight.intensity) * dt * 20;

  // Bulbos do corredor
  ['left', 'right'].forEach(function(side) {
    var on = Game.lights[side];
    var bulbs = objs['corr_bulbs_' + side] || [];
    for (var i = 0; i < bulbs.length; i++) {
      bulbs[i].material.emissiveIntensity = on ? 2.0 : 0.5;
    }
  });

  // LEDs e halos das portas
  ['left', 'right'].forEach(function(side) {
    var led = objs['door_led_' + side];
    var halo = objs['door_halo_' + side];
    var dLight = objs['door_light_' + side];
    if (Game.doors[side]) {
      var pulse = 0.7 + Math.sin(Game.ambientTime * 4) * 0.3;
      if (led) { var cm = getDoorLedMat(side); cm.emissiveIntensity = 2.5 * pulse; if (led.material !== cm) led.material = cm; }
      if (halo) halo.intensity = 0.9 * pulse;
      if (dLight) dLight.intensity += (0.7 - dLight.intensity) * dt * 4;
    } else {
      if (led && led.material !== MAT.ledRed) led.material = MAT.ledRed;
      if (halo) halo.intensity = 0.4;
      if (dLight) dLight.intensity += (0 - dLight.intensity) * dt * 4;
    }
  });

  // Flicker da lâmpada
  Game.flickerNext -= dt;
  if (Game.flickerNext <= 0 && !Game.flickerActive) {
    if (Math.random() < 0.3) {
      Game.flickerActive = 'surge';
      Game.flickerTime = 0.15 + Math.random() * 0.25;
      Game.flickerPeak = 1.3 + Math.random() * 0.4;
    } else {
      Game.flickerActive = 'flicker';
      Game.flickerTime = 0.1 + Math.random() * 0.15;
    }
  }
  if (Game.flickerActive) {
    Game.flickerTime -= dt;
    if (Game.flickerActive === 'flicker') {
      Game.flickerBoost = Math.random() > 0.5 ? -0.35 : 0.15;
    } else {
      var r = Math.max(0, Math.min(1, 1 - Game.flickerTime / 0.4));
      var curve = r < 0.3 ? r / 0.3 : (r < 0.6 ? 1 : 1 - (r - 0.6) / 0.4);
      Game.flickerBoost = Game.flickerPeak * curve;
    }
    if (Game.flickerTime <= 0) {
      Game.flickerActive = null;
      Game.flickerBoost = 0;
      Game.flickerNext = 3 + Math.random() * 6;
    }
  }

  if (objs.lampLight && objs.lampGlobe) {
    var base = 1.1;
    var ff = 1 + (Game.flickerBoost || 0);
    objs.lampLight.intensity = Math.max(0.3, base * ff);
    objs.lampGlobe.material.emissiveIntensity = Math.max(0.6, 2.2 * ff);
  }

  // Ventilador
  if (fanBlades) fanBlades.rotation.z += dt * 1.1;   // rotação lenta e sutil

  // LEDs rádio
  if (objs.radioLeds) {
    var toggle = Math.floor(Game.ambientTime * 3) % 2;
    for (var rl = 0; rl < objs.radioLeds.length; rl++) {
      var rm = (rl === toggle) ? MAT.ledRed : MAT.plasticBlack;
      if (objs.radioLeds[rl].material !== rm) objs.radioLeds[rl].material = rm;
    }
  }

  // LED câmera
  if (objs.secCamLed) {
    var on2 = Math.sin(Game.ambientTime * 2) > 0;
    var cmat = on2 ? MAT.ledRed : MAT.plasticBlack;
    if (objs.secCamLed.material !== cmat) objs.secCamLed.material = cmat;
  }

  // Monitor screen
  var nowSec = Math.floor(Game.ambientTime * 2);
  if (nowSec !== objs.lastMonitorDraw) {
    objs.lastMonitorDraw = nowSec;
    drawMonitorScreen();
  }

  if (objs.monLight) {
    var target = Game.monitorOpen ? 0.75 : 0.55;
    objs.monLight.intensity += (target - objs.monLight.intensity) * dt * 4;
  }

  updateHUD();
}

/* ================================================================
   LOOP
   ================================================================ */
function loop(now) {
  if (!Game.running) return;
  if (Game.paused) { Game.lastFrame = now; requestAnimationFrame(loop); return; }
  var mobile = Mode.current === 'mobile';

  if (mobile) {
    // estima a taxa de atualização da tela nos primeiros quadros
    if (Perf.hz === 0) {
      var gap = now - Perf.lastRaf; Perf.lastRaf = now;
      if (gap > 0 && gap < 50) { Perf.hzSum += gap; Perf.hzN++; }
      if (Perf.hzN >= 45) { Perf.hz = 1000 / (Perf.hzSum / Perf.hzN); Perf.cap = Perf.hz >= 110; }
    }
    // tela de 120/144Hz: renderiza a 60 quadros/s
    if (Perf.cap) {
      var step = 1000 / Perf.CAP_HZ;
      if (Perf.nextT === 0) Perf.nextT = now;
      if (now < Perf.nextT - 1) { requestAnimationFrame(loop); return; }
      Perf.nextT += step;
      if (Perf.nextT < now - step) Perf.nextT = now;
    }
  }

  var frameMs = now - Game.lastFrame;
  var dt = Math.min(0.1, frameMs / 1000);
  Game.lastFrame = now;
  update(dt);

  if (mobile) {
    // matrizes: só o que se mexe
    for (var d = 0; d < Perf.dyn.length; d++) Perf.dyn[d].updateMatrixWorld(true);
    // sombra: 30x/s, e a cada quadro enquanto uma porta se move (e no quadro em que ela para)
    Perf.shadowAcc += dt;
    var moving = Game.doorAnim.left !== Game.doorTarget.left || Game.doorAnim.right !== Game.doorTarget.right;
    if (moving || Perf.wasMoving || Perf.shadowAcc >= 1 / Perf.SHADOW_HZ - 0.004) {
      renderer.shadowMap.needsUpdate = true;
      Perf.shadowAcc = 0;
    }
    Perf.wasMoving = moving;
    adaptResolution(frameMs);
  }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

if (document.readyState === 'loading') {
  window.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

}
</script>
